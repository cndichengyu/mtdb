name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (real errors only)
        run: ruff check mtdb scripts tests --select F401,F841,F821,E9

      - name: Unit tests
        run: pytest tests -q

      - name: Smoke train (debug preset, 1 epoch)
        run: |
          python scripts/train.py --config configs/debug.yaml \
            --run-name ci_smoke --out-dir /tmp/mtdb_ci \
            --set train.epochs=1 train.online_epochs=1 train.n_train=8 \
                  train.n_eval=4 train.n_recall_train=8 train.n_recall_eval=4 \
                  train.ablations=false train.forgetting_stress=false \
                  train.save_model=false train.plot=false
